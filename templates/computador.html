<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Equipamentos e Suprimentos de TI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <a href="{{ url_for('index') }}" class="logo"><img src="{{ url_for('static', filename='imagens/logo.png') }}" alt="Gestão de Computadores"></a>
        <nav class="main-nav">
            <button class="hamburger" aria-label="Abrir menu">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </button>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Impressoras</a></li>
                <li><a href="{{ url_for('toner') }}">Toner</a></li>
                <li><a href="{{ url_for('unidadeimagem') }}">Unidade de Imagem</a></li>
                <li><a href="{{ url_for('computador') }}">Computadores</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="main-content">
            <button id="open-side-menu" class="btn-primary">Adicionar Computador</button>
            <h1>Computadores</h1>
            <div id="computer-list" class="computer-grid"></div>
            <!-- O conteúdo da página de computadores viria aqui -->
        </div>
    </main>
    <aside id="add-computer-menu" class="side-menu">
        <div class="side-menu-header">
            <h2>Adicionar Computador</h2>
            <button id="close-side-menu" class="close-btn">&times;</button>
        </div>
        <div class="side-menu-content">
            <form id="add-computer-form">
                <div class="form-group">
                    <label for="computer-brand">Marca</label>
                    <input type="text" id="computer-brand" name="computer-brand" required>
                </div>
                <div class="form-group">
                    <label for="computer-model">Modelo</label>
                    <input type="text" id="computer-model" name="computer-model" required>
                </div>
                <div class="form-group">
                    <label for="computer-asset">Patrimônio</label>
                    <input type="text" id="computer-asset" name="computer-asset">
                </div>
                <div class="form-group">
                    <label for="computer-serial">Número de Série</label>
                    <input type="text" id="computer-serial" name="computer-serial">
                </div>
                <div class="form-group">
                    <label for="computer-sector">Setor</label>
                    <input type="text" id="computer-sector" name="computer-sector">
                </div>
                <button type="submit" class="btn-primary">Salvar</button>
            </form>
        </div>
    </aside>
    <div id="overlay" class="overlay"></div>

    <footer class="footer">
        <div class="footer-container">
             <div class="footer-row">
                <div class="footer-col">
                    <img src="{{ url_for('static', filename='imagens/logo.png') }}" alt="Logo" class="footer-logo">
                    <p>Software de gestão de Computadores, impressoras e suprimentos.</p>
                </div>
                <div class="footer-col">
                    <h4>Siga-nos</h4>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Gestão de Equipamentos de TI. Todos os direitos reservados. Desenvolvido por Diego José Rosa da Silva.</p>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
